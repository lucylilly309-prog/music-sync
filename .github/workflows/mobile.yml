name: Build APK and IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
env:
  SERVER_URL: ${{ vars.SERVER_URL }}
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-shell } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: app-shell/android
      - uses: actions/upload-artifact@v4
        with:
          name: SyncPair-apk
          path: app-shell/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app-shell } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          (cd build && zip -qr SyncPair-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: SyncPair-ipa
          path: app-shell/build/SyncPair-unsigned.ipa
